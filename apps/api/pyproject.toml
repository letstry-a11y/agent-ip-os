[project]
name = "agent-ip-api"
version = "0.0.1"
description = "FastAPI control-plane skeleton for Agent IP OS"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ip_api"]
