name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.13-alpine3.23
        env:
          POSTGRES_DB: agent_ip
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_USER: agent_ip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_ip -d agent_ip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          uv python install
          uv sync --locked --all-groups

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts

      - name: Run repository quality gates
        run: npm run check

      - name: Run PostgreSQL migration integration tests
        env:
          DATABASE_URL: postgresql://agent_ip:ci_test_only@127.0.0.1:5432/agent_ip
        run: npm run check:integration

      - name: Validate Docker Compose definition
        run: npm run stack:config

      - name: Build web console
        run: npm run build
