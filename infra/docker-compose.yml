name: agent-ip-os

services:
  postgres:
    image: postgres:16.13-alpine3.23
    environment:
      POSTGRES_DB: agent_ip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run npm run stack:up first}
      POSTGRES_USER: agent_ip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_ip -d agent_ip"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  object-storage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?run npm run stack:up first}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?run npm run stack:up first}
      GARAGE_DEFAULT_BUCKET: agent-ip-assets
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?run npm run stack:up first}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:?run npm run stack:up first}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?run npm run stack:up first}
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    init: true
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_PORT:-3900}:3900"
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  temporal:
    image: temporalio/temporal:1.8.2
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /home/temporal/temporal.db
    healthcheck:
      test:
        ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    init: true
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8233"
    restart: unless-stopped
    volumes:
      - temporal-data:/home/temporal

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://agent_ip:${POSTGRES_PASSWORD}@postgres:5432/agent_ip
      DRY_RUN: "true"
      EXTERNAL_SIDE_EFFECTS_ENABLED: "false"
      OBJECT_STORAGE_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY}
      OBJECT_STORAGE_ENDPOINT: http://object-storage:3900
      OBJECT_STORAGE_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY}
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      object-storage:
        condition: service_healthy
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    init: true
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp

volumes:
  garage-data:
  garage-meta:
  postgres-data:
  temporal-data:
